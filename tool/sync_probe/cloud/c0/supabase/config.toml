# Shared spaces C0 prototype only (docs/SHARED_SPACES_C0_PLAN.md): a throwaway
# local stack, separate from Fundly's (../../../../supabase). Ports 563xx so
# both can run. Never linked to a hosted project; never pass --remote.
project_id = "fundly-c0"

[api]
enabled = true
port = 56321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 56322
shadow_port = 56320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[studio]
enabled = false
port = 56323

[local_smtp]
enabled = false
port = 56324

[storage]
enabled = false

[realtime]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:7358"
additional_redirect_urls = []
enable_signup = true

[auth.email]
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
