targets:
  $default:
    builders:
      drift_dev:
        options:
          # Store DateTime as ISO-8601 text (readable, keeps UTC offset).
          store_date_time_values_as_text: true
          # Used by `dart run drift_dev make-migrations` to snapshot each
          # schema version and generate migration tests.
          databases:
            app_database: lib/core/database/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
