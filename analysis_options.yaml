# Static analysis for Fundly. Run with `flutter analyze`.
#
# Base: the recommended Flutter lints. On top of that we enable strict type
# checks and a few extra rules (below). Rules: https://dart.dev/lints
#
# Do not suppress a lint with `// ignore:` without a comment explaining why
# (see CLAUDE.md §7).

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
  language:
    # Catch implicit dynamic casts and missing type information early; this
    # matters for money and persistence code where a wrong type is a bug.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Types and correctness
    - always_declare_return_types
    - unawaited_futures
    - avoid_dynamic_calls

    # Immutability and const (CLAUDE.md §7: immutable models, const constructors)
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_locals

    # Consistency
    - prefer_single_quotes
    - directives_ordering
